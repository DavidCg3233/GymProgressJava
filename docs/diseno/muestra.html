<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymProgress · muestra del rediseño</title>
<style>
/* Muestra de la spec 007 y DESIGN.md. Estática: no es la app. */
.claro {
  --fondo:#F7F6F2; --superficie:#FFFFFF; --superficie-2:#EFEEE9; --linea:#E4E2DC;
  --tinta:#141414; --tinta-suave:#5F5E59; --acento:#141414; --sobre-acento:#FFFFFF;
  --acento-tinte:#EFEEE9; --dorado:#836419; --sobre-dorado:#FFFFFF; --dorado-tinte:#F5EEDC; --aviso:#8A5300; --velo:rgba(255,255,255,.85);
}
.oscuro {
  --fondo:#0A0A0A; --superficie:#161616; --superficie-2:#222222; --linea:#2C2C2C;
  --tinta:#F2F1ED; --tinta-suave:#A09E98; --acento:#F2F1ED; --sobre-acento:#0A0A0A;
  --acento-tinte:#222222; --dorado:#D4B062; --sobre-dorado:#0A0A0A; --dorado-tinte:#2A2418; --aviso:#F3C350; --velo:rgba(22,24,25,.85);
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px 48px; background: #D9D9D4; color: #16181A;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
}
.titulo { max-width: 1240px; margin: 0 auto 24px; }
.titulo h1 { margin: 0 0 4px; font-size: 22px; }
.titulo p { margin: 0; color: #4A4E52; font-size: 15px; }
.mesa { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
.par { display: grid; gap: 10px; justify-items: center; }
.par > span { font-size: 13px; font-weight: 600; color: #4A4E52; letter-spacing: .04em; text-transform: uppercase; }

.tel {
  /* 375 px de pantalla real: el marco va por fuera. */
  box-sizing: content-box; width: 375px; height: 760px; border-radius: 54px; overflow: hidden; position: relative;
  background: var(--fondo); color: var(--tinta); border: 10px solid #111;
  font-variant-numeric: tabular-nums;
}
.estado { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 15px; font-weight: 600; }
.contenido { padding: 4px 16px 140px; display: grid; gap: 24px; height: calc(100% - 44px); overflow: hidden; }

.cabeza { display: flex; align-items: center; justify-content: space-between; }
.cabeza h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; }
.cabeza small { display: block; font-size: 13px; color: var(--tinta-suave); font-weight: 500; }
.btn-texto { background: none; border: 0; color: var(--acento); font: inherit; font-size: 17px; min-height: 44px; min-width: 44px; padding: 0 4px; }
.aviso { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--tinta-suave); }
.aviso i { width: 8px; height: 8px; border-radius: 50%; background: var(--aviso); display: inline-block; }

.grupo { background: var(--superficie); border-radius: 14px; overflow: hidden; }
.grupo-cab { padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.grupo-cab h2 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; }
.grupo-cab span { font-size: 13px; color: var(--tinta-suave); font-weight: 500; }

.cols, .serie { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; padding: 0 8px; }
/* La sesión es la pantalla más densa: margen de 12 para que los +/− de 44 quepan con 8 de aire. */
.contenido.densa { padding-left: 12px; padding-right: 12px; }
.cols { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--tinta-suave); padding-bottom: 6px; text-align: center; }
.serie { min-height: 64px; border-top: 1px solid var(--linea); }
.serie.hecha { background: var(--dorado-tinte); }
.valor { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
.valor b { font-size: 24px; line-height: 28px; font-weight: 600; min-width: 2.4ch; text-align: center; display: block; }
.valor em { font-style: normal; font-size: 11px; color: var(--tinta-suave); display: block; text-align: center; }
.paso { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 0; background: var(--superficie-2); color: var(--tinta); font-size: 18px; line-height: 1; padding: 0; }
.hecha .paso { visibility: hidden; }
.check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--tinta-suave); background: none; display: grid; place-items: center; padding: 0; color: var(--tinta); font: 600 17px/1 inherit; font-family: inherit; }
.hecha .check { border-color: var(--dorado); background: var(--dorado); }
.check svg { width: 20px; height: 20px; stroke: var(--sobre-dorado); }
.check:not(.lleno) svg { display: none; }

.btn-sec { margin: 8px 12px 12px 16px; width: calc(100% - 28px); min-height: 44px; border: 0; border-radius: 10px; background: var(--acento-tinte); color: var(--acento); font: inherit; font-size: 17px; font-weight: 600; }
.btn-pri { width: 100%; min-height: 50px; border: 0; border-radius: 10px; background: var(--acento); color: var(--sobre-acento); font: inherit; font-size: 17px; font-weight: 600; }

.fila { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 16px; border-top: 1px solid var(--linea); font-size: 17px; }
.fila:first-of-type { border-top: 0; }
.fila span { color: var(--tinta-suave); font-size: 15px; }
.etiqueta { font-size: 13px; color: var(--tinta-suave); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 -16px 4px; }
.hoy { display: grid; gap: 4px; }
.hoy b { font-size: 24px; font-weight: 600; }
.hoy span { font-size: 15px; color: var(--tinta-suave); }

.franja { position: absolute; left: 8px; right: 8px; bottom: 92px; height: 48px; border-radius: 24px; background: var(--dorado-tinte); display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 600; }
.franja i { width: 8px; height: 8px; border-radius: 50%; background: var(--dorado); }
.franja span { margin-left: auto; color: var(--dorado); font-size: 20px; }
.barra { position: absolute; left: 0; right: 0; bottom: 0; height: 83px; padding-bottom: 34px; background: var(--velo); border-top: 1px solid var(--linea); display: grid; grid-template-columns: repeat(4, 1fr); }
.barra a { display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--tinta-suave); text-decoration: none; }
.barra a.actual { color: var(--acento); }
.barra svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.paleta { max-width: 1240px; margin: 32px auto 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.paleta div { border-radius: 10px; padding: 12px; font-size: 12px; min-height: 64px; display: grid; align-content: end; }
</style>
</head>
<body>
<div class="titulo">
  <h1>Muestra del rediseño · spec 007</h1>
  <p>Calmado en lo visual, denso en los datos. Blanco y negro con toques dorados. Letra del sistema. Izquierda: tema claro · derecha: tema oscuro.</p>
</div>

<div class="mesa" id="mesa"></div>

<template id="sesion">
  <div class="tel">
    <div class="estado"><span>9:41</span><span>●●●</span></div>
    <div class="contenido densa">
      <div class="cabeza">
        <h1>Pecho<small>Sesión en curso · 35 min</small></h1>
        <button class="btn-texto">Minimizar</button>
      </div>
      <div class="aviso"><i></i>Sin conexión · 3 cambios guardados en el celular</div>
      <section class="grupo">
        <div class="grupo-cab"><h2>Press inclinado</h2><span>Pecho</span></div>
        <div class="cols"><span>KG</span><span>REPS</span><span></span></div>
        <div class="serie hecha">
          <div class="valor"><button class="paso">−</button><b>30</b><button class="paso">+</button></div>
          <div class="valor"><button class="paso">−</button><b>10</b><button class="paso">+</button></div>
          <button class="check lleno" aria-label="Serie 1 hecha"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        </div>
        <div class="serie hecha">
          <div class="valor"><button class="paso">−</button><b>32,5</b><button class="paso">+</button></div>
          <div class="valor"><button class="paso">−</button><b>8</b><button class="paso">+</button></div>
          <button class="check lleno" aria-label="Serie 2 hecha"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        </div>
        <div class="serie">
          <div class="valor"><button class="paso">−</button><div><b>32,5</b><em>última vez</em></div><button class="paso">+</button></div>
          <div class="valor"><button class="paso">−</button><div><b>6</b><em>última vez</em></div><button class="paso">+</button></div>
          <button class="check" aria-label="Confirmar serie 3">3</button>
        </div>
        <button class="btn-sec">+ Serie</button>
      </section>
      <section class="grupo">
        <div class="grupo-cab"><h2>Fondos</h2><span>Pecho · peso corporal</span></div>
        <div class="cols"><span>KG</span><span>REPS</span><span></span></div>
        <div class="serie">
          <div class="valor"><button class="paso">−</button><div><b>0</b><em>de la rutina</em></div><button class="paso">+</button></div>
          <div class="valor"><button class="paso">−</button><div><b>12</b><em>de la rutina</em></div><button class="paso">+</button></div>
          <button class="check" aria-label="Confirmar serie 1">1</button>
        </div>
      </section>
    </div>
  </div>
</template>

<template id="inicio">
  <div class="tel">
    <div class="estado"><span>9:41</span><span>●●●</span></div>
    <div class="contenido">
      <div class="cabeza">
        <h1>Hola, David<small>Martes, 11 de noviembre</small></h1>
        <button class="btn-texto" aria-label="Cuenta"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.4-3 4-4.5 7-4.5s5.6 1.5 7 4.5"/></svg></button>
      </div>
      <p class="etiqueta">Hoy toca</p>
      <section class="grupo" style="padding:16px; display:grid; gap:16px">
        <div class="hoy"><b>Pecho</b><span>4 ejercicios · última vez hace 7 días</span></div>
        <button class="btn-pri">Empezar Pecho</button>
      </section>
      <p class="etiqueta">Esta semana</p>
      <section class="grupo" style="padding:16px">
        <div class="hoy"><b>3 de 4 sesiones</b><span>Te falta 1 para tu meta</span></div>
      </section>
      <p class="etiqueta">Últimas sesiones</p>
      <section class="grupo">
        <div class="fila">Pierna<span>dom 9 nov</span></div>
        <div class="fila">Sesión libre<span>vie 7 nov</span></div>
        <div class="fila">Espalda<span>mié 5 nov</span></div>
      </section>
    </div>
    <div class="franja"><i></i>Pecho · 35 min<span>›</span></div>
    <nav class="barra">
      <a class="actual"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>Inicio</a>
      <a><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Rutinas</a>
      <a><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/><path d="M4 4v15h16"/></svg>Progreso</a>
      <a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/></svg>Historial</a>
    </nav>
  </div>
</template>

<div class="paleta" id="paleta"></div>

<script>
const mesa = document.getElementById('mesa')
for (const [plantilla, nombre] of [['sesion', 'Sesión en curso'], ['inicio', 'Inicio con sesión minimizada']]) {
  for (const tema of ['claro', 'oscuro']) {
    const par = document.createElement('div')
    par.className = 'par'
    par.innerHTML = `<span>${nombre} · ${tema}</span>`
    const tel = document.getElementById(plantilla).content.cloneNode(true)
    tel.querySelector('.tel').classList.add(tema)
    par.appendChild(tel)
    mesa.appendChild(par)
  }
}
const colores = [
  ['Acento (tinta)', '#141414', '#F2F1ED'], ['Dorado', '#836419', '#D4B062'], ['Dorado tinte', '#F5EEDC', '#2A2418'], ['Fondo', '#F7F6F2', '#0A0A0A'],
  ['Superficie', '#FFFFFF', '#161616'], ['Tinta suave', '#5F5E59', '#A09E98'],
  ['Aviso', '#8A5300', '#F3C350'], ['Error', '#B42318', '#FF8B7B'],
]
const paleta = document.getElementById('paleta')
for (const [nombre, claro, oscuro] of colores) {
  for (const [tema, hex] of [['claro', claro], ['oscuro', oscuro]]) {
    const d = document.createElement('div')
    const lum = parseInt(hex.slice(1, 3), 16) * 0.3 + parseInt(hex.slice(3, 5), 16) * 0.59 + parseInt(hex.slice(5, 7), 16) * 0.11
    d.style.background = hex
    d.style.color = lum > 140 ? '#16181A' : '#F1F2F0'
    d.innerHTML = `<b>${nombre}</b>${tema} · ${hex}`
    paleta.appendChild(d)
  }
}
</script>
</body>
</html>
