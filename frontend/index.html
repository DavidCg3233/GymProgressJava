<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app ocupa toda la pantalla del iPhone, incluida la zona de la muesca. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1f1c" />
    <!-- La app es privada: que los buscadores no la listen (RNF-PLA-04). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- RNF-PLA-03: al agregarla a la pantalla de inicio del iPhone se abre como una app. -->
    <link rel="icon" type="image/png" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymProgress" />
    <title>GymProgress</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
