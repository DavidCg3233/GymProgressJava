<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- ¡¡META TAGS ANTI-CACHÉ!! -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>GymProgress - Acceso</title>
    
    <!-- 
    ========================================
    ¡¡INICIO DE CSS INTEGRADO!!
    (v5.0 - Nueva Paleta de Colores "Dark Mode")
    ========================================
    -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        /* Definición de la nueva paleta de colores */
        :root {
            --bg-dark: #0F172A;     /* Fondo principal (Azul oscuro/negro) */
            --bg-card: #1E293B;     /* Fondo de las tarjetas (Azul-gris) */
            --border-color: #334155; /* Borde sutil */
            --text-light: #E2E8F0;   /* Texto principal (Casi blanco) */
            --text-muted: #94A3B8;   /* Texto secundario (Gris-azul) */
            --primary: #3B82F6;    /* Azul primario (Botones) */
            --accent: #10B981;     /* Verde Acento (Éxito, Borde Activo) */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark); /* Fondo oscuro */
            color: var(--text-light); /* Texto claro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Cambiado de height a min-height */
            margin: 0;
            padding: 20px 0; /* Añadido padding vertical */
            overflow-y: auto; /* Permitir scroll vertical */
        }
        .card {
            background: var(--bg-card); /* Tarjeta oscura */
            border: 1px solid var(--border-color); /* Borde sutil */
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 500px; /* Aumentado el ancho máximo */
            box-sizing: border-box;
            margin: 20px auto; /* Centrado horizontal */
            overflow-y: auto; /* Permitir scroll dentro de la tarjeta si es necesario */
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap; /* Permite que los elementos se envuelvan en pantallas pequeñas */
        }
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column; /* Apila los elementos en pantallas pequeñas */
            }
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            color: var(--text-light); /* Texto claro */
            font-weight: 700;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted); /* Texto grisáceo */
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: 500;
            color: var(--text-muted); /* Texto grisáceo */
            margin-bottom: -5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="number"],
        select {
            padding: 14px;
            border: 1px solid var(--border-color); /* Borde sutil */
            background-color: var(--bg-dark); /* Fondo de input oscuro */
            color: var(--text-light); /* Texto de input claro */
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus {
             border-color: var(--primary); /* Borde azul al seleccionar */
             outline: none;
        }
        
        /* Arreglo para que el calendario de fecha se vea en modo oscuro */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        
        button {
            background-color: var(--primary); /* Botón azul */
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2563EB; /* Azul más brillante */
        }
        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .toggle-link a {
            color: var(--primary); /* Enlace azul */
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 10px 0;
        }
    </style>
    <!-- ¡¡FIN DE CSS INTEGRADO!! -->
</head>
<body>

    <!-- ======== RF02: FORMULARIO DE LOGIN (Visible por defecto) ======== -->
    <div class="card" id="login-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="../img/Gemini_Generated_Image_m66imgm66imgm66i-removebg-preview.png" alt="GymProgress Logo" style="width: 150px; height: auto;">
        </div>
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Rastrea tu progreso físico y alcanza tus metas</p>

        <form id="form-login">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="tu.correo@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label for="login-pass">Contraseña</label>
                <input type="password" id="login-pass" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>

        <p class="toggle-link">
            ¿No tienes una cuenta? <a id="show-register">Crear una</a>
        </p>
    </div>

    <!-- ======== RF01: FORMULARIO DE REGISTRO (Oculto por defecto) ======== -->
    <div class="card" id="register-container" style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="../img/Gemini_Generated_Image_m66imgm66imgm66i-removebg-preview.png" alt="GymProgress Logo" style="width: 150px; height: auto;">
        </div>
        <h2>Crea tu Cuenta</h2>
        <p class="subtitle">Comienza a rastrear tu progreso físico hoy</p>

        <form id="form-registro">
            <!-- CAMPOS DE LA BD: 'usuario' -->
            <div class="form-row">
                <div class="form-group">
                    <label for="register-username">Nombre de Usuario</label>
                    <input type="text" id="register-username" placeholder="ej. davidc" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Correo Electrónico</label>
                    <input type="email" id="register-email" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="register-pass1">Contraseña</label>
                    <input type="password" id="register-pass1" required>
                </div>
                <div class="form-group">
                    <label for="register-pass2">Confirmar Contraseña</label>
                    <input type="password" id="register-pass2" required>
                </div>
            </div>
            
            <hr>

            <!-- CAMPOS DE LA BD: 'cliente' -->
            <div class="form-row">
                <div class="form-group">
                    <label for="register-pnombre">Primer Nombre</label>
                    <input type="text" id="register-pnombre" required>
                </div>
                <div class="form-group">
                    <label for="register-snombre">Segundo Nombre</label>
                    <input type="text" id="register-snombre"> <!-- Opcional -->
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="register-papellido">Primer Apellido</label>
                    <input type="text" id="register-papellido" required>
                </div>
                <div class="form-group">
                    <label for="register-sapellido">Segundo Apellido</label>
                    <input type="text" id="register-sapellido"> <!-- Opcional -->
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="register-fecha-nac">Fecha de Nacimiento</label>
                    <!-- ¡Placeholder AAAA-MM-DD añadido! -->
                    <input type="date" id="register-fecha-nac" placeholder="AAAA-MM-DD" required>
                </div>
                <div class="form-group">
                    <label for="register-sexo">Sexo</label>
                    <select id="register-sexo" required>
                        <option value="1">Masculino</option>
                        <option value="2">Femenino</option>
                    </select>
                </div>
            </div>

            <hr>

            <!-- CAMPOS DE LA BD: 'progreso' (Inicial) -->
            <div class="form-row">
                <div class="form-group">
                    <label for="register-peso">Peso Inicial (kg)</label>
                    <input type="number" step="0.1" id="register-peso" placeholder="ej. 80.5" required>
                </div>
                <div class="form-group">
                    <label for="register-altura">Altura (m)</label>
                    <input type="number" step="0.01" id="register-altura" placeholder="ej. 1.75" required>
                </div>
            </div>
            
            <button type="submit">Crear Cuenta</button>
        </form>

        <p class="toggle-link">
            ¿Ya tienes una cuenta? <a id="show-login">Iniciar sesión</a>
        </p>
    </div>

    <!-- 
    ========================================
    ¡¡INICIO DE JAVASCRIPT INTEGRADO!!
    (v5.0 - Lógica de Navegación)
    ========================================
    -->
    <!-- 
  * ======================================
  * JAVASCRIPT (Lógica de Login/Registro - ¡CORREGIDO!)
  * ======================================
  -->
<script>
    // Variable global para evitar que se ejecute múltiples veces
    let javaBridgeInicializado = false;

    /**
     * Esta es la función que Java llama desde el MainAppController
     * (o que el 'poller' llama)
     */
    function javaBridgeReady() {
        if (javaBridgeInicializado) return;
        javaBridgeInicializado = true;

        // Avisa a Java que el JS del index está listo
        window.javaBridge.logDesdeJS("Hola Java, soy JavaScript (v5.0) y el puente funciona!");

        // --- 1. Definir elementos del DOM ---
        const loginContainer = document.getElementById("login-container");
        const registerContainer = document.getElementById("register-container");
        const showRegisterLink = document.getElementById("show-register");
        const showLoginLink = document.getElementById("show-login");

        // --- Formularios ---
        const formLogin = document.getElementById("form-login");
        const formRegistro = document.getElementById("form-registro");
        
        // --- Campos de Login (¡¡IDs CORREGIDOS!!) ---
        const loginEmailInput = document.getElementById("login-email");
        const loginPassInput = document.getElementById("login-pass");

        // --- Campos de Registro (¡¡IDs CORREGIDOS!!) ---
        const regUsername = document.getElementById("register-username");
        const regEmail = document.getElementById("register-email");
        const regPass1 = document.getElementById("register-pass1");
        const regPass2 = document.getElementById("register-pass2");
        const regPNombre = document.getElementById("register-pnombre");
        const regSNombre = document.getElementById("register-snombre");
        const regPApellido = document.getElementById("register-papellido");
        const regSApellido = document.getElementById("register-sapellido");
        const regSexo = document.getElementById("register-sexo");
        const regFechaNac = document.getElementById("register-fecha-nac");
        const regPeso = document.getElementById("register-peso");
        const regAltura = document.getElementById("register-altura");


        // --- 2. Lógica de Navegación (Mostrar/Ocultar) ---
        if (showRegisterLink) {
            showRegisterLink.addEventListener("click", (e) => {
                e.preventDefault();
                loginContainer.style.display = "none";
                registerContainer.style.display = "block";
            });
        }
        if (showLoginLink) {
            showLoginLink.addEventListener("click", (e) => {
                e.preventDefault();
                registerContainer.style.display = "none";
                loginContainer.style.display = "block";
            });
        }

        // --- 3. Lógica de LOGIN (¡¡CORREGIDA!!) ---
        if (formLogin && loginEmailInput && loginPassInput) {
            formLogin.addEventListener("submit", (e) => {
                e.preventDefault();
                const email = loginEmailInput.value;
                const pass = loginPassInput.value;

                if (!email || !pass) {
                    alert("Por favor, ingresa email y contraseña.");
                    return;
                }

                try {
                    const nombreUsuario = window.javaBridge.login(email, pass);
                    if (nombreUsuario) {
                        window.javaBridge.logDesdeJS(`Login exitoso, bienvenido ${nombreUsuario}`);
                        sessionStorage.setItem('username', nombreUsuario);
                        window.location.href = 'dashboard.html';
                    } else {
                        alert("Usuario o contraseña incorrectos.");
                    }
                } catch (err) {
                    console.error("Error al llamar a javaBridge.login()", err);
                    alert("Error fatal al contactar el backend.");
                }
            });
        } else {
            console.error("Error JS: No se encontraron los elementos del formulario de login. Revisa los IDs.");
        }

        // --- 4. Lógica de REGISTRO (¡¡CORREGIDA!!) ---
        if (formRegistro) {
            formRegistro.addEventListener("submit", (e) => {
                e.preventDefault();

                // Validar contraseñas
                if (regPass1.value !== regPass2.value) {
                    alert("Las contraseñas no coinciden.");
                    return;
                }
                
                // Validar altura (en metros)
                const alturaMetros = parseFloat(regAltura.value);
                if (alturaMetros > 3) {
                    alert("Por favor, ingresa tu altura en metros (ej: 1.75).");
                    return;
                }

                try {
                    const exito = window.javaBridge.registrarUsuario(
                        regUsername.value, regEmail.value, regPass1.value,
                        regPNombre.value, regSNombre.value, regPApellido.value, regSApellido.value,
                        parseInt(regSexo.value, 10), // Convertir a número
                        regFechaNac.value, // 'YYYY-MM-DD'
                        parseFloat(regPeso.value), // Convertir a número
                        alturaMetros // Usar el valor en metros
                    );

                    if (exito) {
                        alert("¡Registro exitoso! Por favor, inicia sesión.");
                        showLoginLink.click();
                        formRegistro.reset();
                        formLogin.reset();
                    } else {
                        alert("Error en el registro. Es posible que el email o nombre de usuario ya existan.");
                    }
                } catch (err) {
                    console.error("Error al llamar a javaBridge.registrarUsuario()", err);
                    alert("Error fatal al contactar el backend.");
                }
            });
        } else {
             console.error("Error JS: No se encontró el formulario de registro. Revisa los IDs.");
        }

    } // Fin de javaBridgeReady()

    // --- Mecanismo de Polling (Recomendado) ---
    const bridgeCheckInterval = setInterval(() => {
        if (window.javaBridge && typeof window.javaBridge.logDesdeJS === 'function') {
            clearInterval(bridgeCheckInterval); 
            javaBridgeReady(); 
        }
    }, 100);
</script>
    <!-- ¡¡FIN DE JAVASCRIPT INTEGRADO!! -->
</body>
</html>
