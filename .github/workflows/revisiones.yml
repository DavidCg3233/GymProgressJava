# Revisiones automáticas en cada cambio (T-006-05).
# Si alguna falla, el cambio no se fusiona.
name: Revisiones

on:
  pull_request:
  push:
    branches: [main]

# Lo mínimo: leer el código. Nada de escribir en el repositorio.
permissions:
  contents: read

concurrency:
  group: revisiones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    name: Servidor (Docker + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valores de un solo uso para esta ejecución; no son secretos reales.
      - name: Crear deploy/.env de prueba
        working-directory: deploy
        run: |
          {
            echo "GP_SECRET_KEY=$(openssl rand -hex 32)"
            echo "GP_DEBUG=0"
            echo "GP_ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "GP_DB_NAME=gymprogress"
            echo "GP_DB_USER=gymprogress"
            echo "GP_DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      # Las mismas imágenes y la misma base que producción (RNF-MAN-02, RNF-MAN-04).
      - name: Migraciones y pruebas dentro de Docker Compose
        working-directory: deploy
        run: >
          docker compose run --rm backend
          sh -c "python manage.py migrate --noinput && pytest -p no:cacheprovider"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # RNF-SEG-07: ninguna dependencia con vulnerabilidades conocidas.
      - name: Auditar dependencias de Python
        run: pipx run pip-audit --requirement backend/requirements.txt

  pantalla:
    name: Pantalla (Vitest + compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "ci" instala exactamente lo que dice package-lock.json (versiones fijas).
      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      # RNF-SEG-07. Solo dependencias que llegan al usuario; severidad alta o crítica.
      - name: Auditar dependencias de JavaScript
        run: npm audit --omit=dev --audit-level=high

  imagen:
    name: Imagen de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La misma imagen que construye Railway: si aquí no se construye, allá tampoco.
      # Si falla, las líneas del error se publican como anotación: GitHub las
      # muestra a cualquiera, aunque no haya iniciado sesión.
      - name: Construir
        run: |
          set -o pipefail
          if ! docker build --progress=plain --tag gymprogress . 2>&1 | tee construccion.log; then
            resumen=$(grep -iE 'error|denied|not found|failed|no such' construccion.log | tail -n 15 | tr '\n' ' ' | cut -c1-3000)
            echo "::error title=Falló la construcción de la imagen::${resumen}"
            exit 1
          fi

      # Arranca la imagen contra un PostgreSQL de prueba y comprueba que responde
      # y que entrega la pantalla con su política de contenido.
      - name: Arrancar y responder
        run: |
          docker network create prueba
          docker run -d --name db --network prueba -p 5432:5432 -e POSTGRES_DB=gp -e POSTGRES_USER=gp -e POSTGRES_PASSWORD=gp postgres:16-alpine
          for intento in $(seq 1 30); do docker exec db pg_isready -U gp -d gp && break; sleep 2; done
          docker run -d --name app --network prueba -p 8000:8000             -e GP_SECRET_KEY=$(openssl rand -hex 32) -e GP_ALLOWED_HOSTS=localhost             -e GP_DB_NAME=gp -e GP_DB_USER=gp -e GP_DB_PASSWORD=gp -e GP_DB_HOST=db -e GP_DUENO_USUARIO=dueno -e GP_DUENO_CORREO=dueno@ejemplo.com -e GP_DUENO_NOMBRE=Dueno -e GP_DUENO_CONTRASENA_TEMPORAL=Temporal-de-la-revision-7             gymprogress
          for intento in $(seq 1 30); do curl -fsS http://localhost:8000/salud/ && break; sleep 2; done
          curl -fsS http://localhost:8000/ | grep -q '<title>GymProgress</title>'
          curl -fsSI http://localhost:8000/ | grep -qi "content-security-policy"
          curl -fsS http://localhost:8000/sw.js > /dev/null
          curl -fsS http://localhost:8000/manifest.webmanifest > /dev/null
          # Crea la cuenta del dueño y nunca escribe la contraseña en los registros (RNF-SEG-08).
          docker logs app 2>&1 | grep -q "Cuenta de dueño creada: dueno"
          ! docker logs app 2>&1 | grep -q "Temporal-de-la-revision-7"

      # T-006-34: el flujo sin conexión, en WebKit (el motor de Safari), contra esta
      # misma imagen. El "modo avión" apaga el contenedor de verdad: así el service
      # worker tiene que abrir la app solo, como en el iPhone sin señal.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Flujo completo sin conexión (Playwright + WebKit)
        working-directory: frontend
        env:
          E2E_URL: http://localhost:8000
          E2E_USUARIO: dueno
          E2E_CONTRASENA_TEMPORAL: Temporal-de-la-revision-7
          E2E_APAGAR: docker stop app
          E2E_ENCENDER: docker start app
        run: |
          npm ci
          npx playwright install --with-deps webkit
          npx playwright test
      # T-006-35: los scripts del respaldo diario, sobre esta base con datos de la
      # prueba anterior. Respalda, restaura en otra base vacía y cuenta las filas.
      - name: Respaldo cifrado y restauración en limpio
        env:
          GP_RESPALDO_DB_URL: postgresql://gp:gp@localhost:5432/gp
          GP_RESPALDO_CLAVE: clave-solo-para-la-revision
          GP_PRUEBA_DB_URL: postgresql://prueba:prueba@localhost:5433/prueba
        run: |
          docker run -d --name restaurada -p 5433:5432 -e POSTGRES_DB=prueba -e POSTGRES_USER=prueba -e POSTGRES_PASSWORD=prueba postgres:18-alpine
          for intento in $(seq 1 30); do docker exec restaurada pg_isready -U prueba -d prueba && break; sleep 2; done
          bash deploy/respaldo.sh prueba.dump.gpg
          bash deploy/comprobar-respaldo.sh prueba.dump.gpg | tee restaurado.txt
          grep -qx "sesiones 1" restaurado.txt
          grep -qx "series 2" restaurado.txt

      - name: Rastro de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastro-playwright
          path: frontend/test-results/
          retention-days: 7

        # Si falla, que se vea por qué.
      - name: Registros del contenedor
        if: failure()
        run: docker logs app || true

  secretos:
    name: Sin secretos en el código
    runs-on: ubuntu-latest
    steps:
      # Historial completo de la rama: un secreto borrado en un commit posterior sigue ahí.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # RNF-SEG-03.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
